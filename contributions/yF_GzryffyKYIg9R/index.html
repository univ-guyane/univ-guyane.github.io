<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Au bord de la rivière</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg id="scene" viewBox="-180 0 1000 420" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#4aa8ff"/>
        <stop offset="1" stop-color="#d6f1ff"/>
      </linearGradient>
      <radialGradient id="soleil">
        <stop offset="0" stop-color="#fffbe0"/>
        <stop offset="0.45" stop-color="#fff3a8" stop-opacity="0.9"/>
        <stop offset="1" stop-color="#fff3a8" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="eau" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#5ad0ee"/>
        <stop offset="1" stop-color="#2680b8"/>
      </linearGradient>
      <linearGradient id="herbeg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#b2ee7a"/>
        <stop offset="1" stop-color="#78c957"/>
      </linearGradient>
      <linearGradient id="fondu" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#000"/>
        <stop offset="1" stop-color="#fff"/>
      </linearGradient>
      <mask id="masque"><rect x="-180" y="300" width="1000" height="120" fill="url(#fondu)"/></mask>
      <pattern id="trame" width="6" height="6" patternUnits="userSpaceOnUse">
        <circle cx="3" cy="3" r="1.1" fill="#10163a" opacity="0.35"/>
      </pattern>

      <clipPath id="cp">
        <circle cx="-20" cy="-48" r="20"/><circle cx="20" cy="-48" r="20"/>
        <circle cx="0" cy="-64" r="24"/><circle cx="0" cy="-40" r="24"/>
      </clipPath>
      <g id="canopee">
        <circle cx="-20" cy="-48" r="20"/><circle cx="20" cy="-48" r="20"/>
        <circle cx="0" cy="-64" r="24"/><circle cx="0" cy="-40" r="24"/>
      </g>
      <g id="lumiere">
        <circle cx="-12" cy="-68" r="12"/><circle cx="-28" cy="-50" r="7"/>
      </g>

      <g id="arbre">
        <ellipse cx="0" cy="2" rx="28" ry="5" fill="#000" opacity="0.15"/>
        <path d="M-6 0 L-5 -34 L5 -34 L6 0 Z" fill="#8a5a3c" stroke="#1a1a2e" stroke-width="3" stroke-linejoin="round"/>
        <use href="#canopee" fill="#1a1a2e" stroke="#1a1a2e" stroke-width="7" stroke-linejoin="round"/>
        <use href="#canopee" fill="#47a860"/>
        <g clip-path="url(#cp)"><circle cx="18" cy="-24" r="26" fill="#2d8a4e"/></g>
        <use href="#lumiere" fill="#8ff09a"/>
      </g>
      <g id="sakura">
        <ellipse cx="0" cy="2" rx="28" ry="5" fill="#000" opacity="0.15"/>
        <path d="M-6 0 L-5 -34 L5 -34 L6 0 Z" fill="#7a4a3a" stroke="#1a1a2e" stroke-width="3" stroke-linejoin="round"/>
        <use href="#canopee" fill="#1a1a2e" stroke="#1a1a2e" stroke-width="7" stroke-linejoin="round"/>
        <use href="#canopee" fill="#ffb3cf"/>
        <g clip-path="url(#cp)"><circle cx="18" cy="-24" r="26" fill="#f08db3"/></g>
        <use href="#lumiere" fill="#ffe8f1"/>
      </g>

      <g id="koi">
        <path d="M-22 0 L-35 -9 L-30 0 L-35 9 Z" fill="#ff7a3d" stroke="#1a1a2e" stroke-width="2" stroke-linejoin="round"/>
        <ellipse cx="0" cy="0" rx="21" ry="8" fill="#ff9a5c" stroke="#1a1a2e" stroke-width="2"/>
        <ellipse cx="-2" cy="-2" rx="9" ry="4" fill="#fff"/>
        <circle cx="14" cy="-2" r="1.6" fill="#1a1a2e"/>
      </g>
    </defs>

    <!-- Ciel, soleil, nuages -->
    <rect x="-180" y="0" width="1000" height="140" fill="url(#ciel)"/>
    <circle cx="450" cy="48" r="70" fill="url(#soleil)"/>
    <circle cx="450" cy="48" r="22" fill="#fffbe0"/>

    <g transform="translate(0 34)"><g class="nuage" style="animation-duration:80s;animation-delay:-25s">
      <ellipse cx="0" cy="6" rx="40" ry="10" fill="#cfe6ff"/>
      <ellipse cx="0" cy="0" rx="40" ry="12" fill="#fff"/><ellipse cx="25" cy="-8" rx="28" ry="14" fill="#fff"/><ellipse cx="-22" cy="-6" rx="22" ry="10" fill="#fff"/>
    </g></g>
    <g transform="translate(0 70)"><g class="nuage" style="animation-duration:110s;animation-delay:-70s">
      <ellipse cx="0" cy="5" rx="30" ry="8" fill="#cfe6ff"/>
      <ellipse cx="0" cy="0" rx="30" ry="9" fill="#fff"/><ellipse cx="18" cy="-6" rx="20" ry="10" fill="#fff"/>
    </g></g>

    <!-- Montagnes -->
    <path d="M-190 126 L-100 92 L-10 126 L70 88 L150 126 Z" fill="#9bb9ee" stroke="#1a1a2e" stroke-width="3" stroke-linejoin="round"/>
    <path d="M400 126 L500 82 L600 126 L700 96 L830 126 Z" fill="#9bb9ee" stroke="#1a1a2e" stroke-width="3" stroke-linejoin="round"/>
    <path d="M180 126 L280 56 L380 126 Z" fill="#7a94e0" stroke="#1a1a2e" stroke-width="3" stroke-linejoin="round"/>
    <path d="M256 73 L280 56 L304 73 L295 70 L284 80 L274 70 Z" fill="#fff" stroke="#1a1a2e" stroke-width="2" stroke-linejoin="round"/>

    <!-- Eau et herbe -->
    <rect x="-180" y="200" width="1000" height="220" fill="url(#eau)"/>
    <rect x="30" y="224" width="70" height="196" fill="#fff" opacity="0.10"/>
    <rect x="330" y="224" width="40" height="196" fill="#fff" opacity="0.10"/>
    <rect x="560" y="224" width="60" height="196" fill="#fff" opacity="0.10"/>
    <rect x="-180" y="118" width="1000" height="102" fill="url(#herbeg)"/>
    <g id="herbes" fill="none" stroke="#4e9a3a" stroke-width="2" stroke-linecap="round"></g>
    <g id="fleurs"></g>

    <!-- Arbres -->
    <use href="#arbre" transform="translate(60 188) scale(1.1)"/>
    <use href="#sakura" transform="translate(172 172) scale(0.9)"/>
    <use href="#arbre" transform="translate(292 192)"/>
    <use href="#sakura" transform="translate(410 180) scale(1.1)"/>
    <use href="#arbre" transform="translate(522 174) scale(0.9)"/>
    <use href="#sakura" transform="translate(608 192)"/>
    <use href="#arbre" transform="translate(-130 182) scale(1.05)"/>
    <use href="#sakura" transform="translate(-40 190) scale(0.95)"/>
    <use href="#arbre" transform="translate(700 178) scale(1.05)"/>
    <use href="#sakura" transform="translate(790 188)"/>

    <!-- Berge de sable -->
    <path d="M-180 206 H60 V213 H150 V205 H240 V215 H330 V209 H430 V203 H520 V211 H820 V224 H-180 Z"
          fill="#f3dc9f" stroke="#1a1a2e" stroke-width="3" stroke-linejoin="round"/>

    <!-- Eau animée -->
    <g id="reflets" fill="#fff" opacity="0.85"></g>
    <g id="etoiles" fill="#fff"></g>

    <!-- Rochers -->
    <ellipse class="onde" cx="214" cy="268" rx="28" ry="7" fill="none" stroke="#fff" stroke-width="2"/>
    <path d="M196 270 L200 258 L212 252 L226 256 L232 270 Z" fill="#9fb0c4" stroke="#1a1a2e" stroke-width="3" stroke-linejoin="round"/>
    <path d="M203 258 L212 254 L218 258 L208 262 Z" fill="#dfe8f2"/>
    <ellipse class="onde" cx="530" cy="372" rx="30" ry="7" fill="none" stroke="#fff" stroke-width="2" style="animation-delay:-1.2s"/>
    <path d="M512 374 L517 360 L530 354 L545 359 L550 374 Z" fill="#9fb0c4" stroke="#1a1a2e" stroke-width="3" stroke-linejoin="round"/>
    <path d="M520 361 L530 356 L537 360 L526 365 Z" fill="#dfe8f2"/>

    <!-- Carpes koï -->
    <g transform="translate(0 300)"><g class="nage" style="animation-duration:32s"><g class="ondule"><use href="#koi"/></g></g></g>
    <g transform="translate(640 345) scale(-1 1)"><g class="nage" style="animation-duration:44s;animation-delay:-18s"><g class="ondule" style="animation-delay:-1s"><use href="#koi" transform="scale(0.85)"/></g></g></g>

    <!-- Trame manga en bas -->
    <rect x="-180" y="300" width="1000" height="120" fill="url(#trame)" mask="url(#masque)"/>

    <!-- Pétales de sakura -->
    <g id="petales" fill="#ffc0d8" stroke="#f08db3" stroke-width="0.6"></g>

    <!-- Bulle de titre et onomatopée -->
    <rect x="143" y="15" width="122" height="32" fill="#1a1a2e"/>
    <rect x="140" y="12" width="122" height="32" fill="#fff" stroke="#1a1a2e" stroke-width="3"/>
    <text x="201" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a2e"
          font-family="'Hiragino Kaku Gothic Pro','Yu Gothic','Meiryo','Noto Sans JP',sans-serif">川のほとり</text>

    <g transform="rotate(-6 435 396)">
      <text class="sara" x="435" y="396" text-anchor="middle" font-size="30" font-weight="900" font-style="italic"
            fill="#fff" stroke="#1a1a2e" stroke-width="5" paint-order="stroke" stroke-linejoin="round"
            font-family="'Hiragino Kaku Gothic Pro','Yu Gothic','Meiryo','Noto Sans JP',sans-serif">サラサラ</text>
    </g>
  </svg>

  <script src="script.js"></script>
</body>
</html>
