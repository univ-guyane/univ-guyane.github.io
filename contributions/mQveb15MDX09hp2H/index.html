<div class="maison">

<!-- ===== Chambre 1 : la lampe ===== -->
<section class="chambre piece" id="piece">
  <span class="plaque">Chambre 1</span>
  <div class="stage">
  <div id="lampe"></div>
  <div class="cone"></div>

  <div class="scene">
    <div id="creature" class="creature"></div>
    <p id="carte" class="carte"></p>
  </div>

  <button id="corde" class="corde" aria-label="Tirer la corde de la lampe">
    <span class="fil"></span><span class="poignee"></span>
  </button>

  <p class="indice" id="indice">← tire la corde</p>
  </div>
  <p class="compteur">Créatures découvertes : <b id="total">0</b></p>
</section>

<!-- ===== Chambre 2 : le bouton qui fuit ===== -->
<section class="chambre fuite" id="fuite">
  <span class="plaque">Chambre 2</span>
  <p class="fuite-titre">Surtout, ne clique pas.</p>
  <button id="fuyard" class="fuyard">Ne clique pas</button>
  <p id="bulle" class="bulle" hidden></p>
  <div id="boum" class="boum" hidden>BOUM</div>
  <p class="compteur">Tentatives : <b id="essais">0</b> · Explosions : <b id="explosions">0</b></p>
</section>

<!-- ===== Chambre 3 : la radio ===== -->
<section class="chambre radio-salle" id="radio-salle">
  <span class="plaque">Chambre 3</span>
  <div class="radio" id="radio">
    <div class="radio-haut">
      <div class="hp"></div>
      <div class="cadran">
        <div class="graduations"><span>88</span><span>92</span><span>96</span><span>100</span><span>104</span><span>108</span></div>
        <div class="aiguille" id="aiguille"></div>
        <input id="freq" class="freq" type="range" min="88" max="108" step="0.1" value="90" aria-label="Fréquence">
      </div>
    </div>
    <div class="radio-bas">
      <button id="power" class="power" aria-label="Allumer la radio">⏻</button>
      <span class="ecran-freq" id="ecran-freq">--.- MHz</span>
      <span class="voyant" id="voyant"></span>
      <div class="bouton-rond" id="bouton-rond"></div>
    </div>
  </div>
  <div class="table"></div>
  <p class="ondes" id="ondes">Allume la radio ⏻ puis tourne le cadran.</p>
</section>

</div>

<script>
// Lampe dessinée en JS : pas de balise svg fermante en dur dans le HTML,
// sinon Live Server injecte son script au milieu et casse tout.
document.getElementById('lampe').outerHTML = '<svg class="lampe" viewBox="0 0 120 120" aria-hidden="true"><line x1="60" y1="0" x2="60" y2="48" stroke="#555" stroke-width="2"/> <rect x="54" y="44" width="12" height="10" rx="2" fill="#666"/> <path d="M30 92 L48 54 H72 L90 92 Z" fill="#2f6b4f" stroke="#1c4433" stroke-width="2"/> <ellipse class="ampoule" cx="60" cy="94" rx="11" ry="8"/><\/svg>';

const piece = document.getElementById('piece');
const corde = document.getElementById('corde');
const zone = document.getElementById('creature');
const carte = document.getElementById('carte');
const total = document.getElementById('total');
const indice = document.getElementById('indice');
let decouvertes = 0;
let minuteur = null;
let audio = null;

// ===== Créatures rares : tes dessins =====
// Mets tes images PNG dans ce dossier et ajoute une ligne par image.
// Une image absente est simplement ignorée.
const RARES = [
  { fichier: 'rare1.png', nom: 'snorlax' },
  { fichier: 'rare2.png', nom: 'pikachuuuuu' },
  { fichier: 'rare3.png', nom: 'mew' },
];
const RARE_CHANCE = 1 / 100;        

const raresDispo = [];
for (const r of RARES) {
  const img = new Image();
  img.onload = () => raresDispo.push(r);
  img.src = r.fichier;
}

const alea = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
const choix = liste => liste[alea(0, liste.length - 1)];

const debuts = ['Tatou', 'Kaya', 'Mous', 'Ara', 'Kour', 'Paka', 'Mani', 'Agou', 'Couac', 'Toukan', 'Iguan', 'Paripou', 'Wifi', 'Bug', 'Pixel', 'Cayen'];
const fins = ['zou', 'rik', 'bo', 'mel', 'ka', 'lou', 'tron', 'nix', 'pa', 'dou', 'fy', 'ssou'];
const types = ['Coupure EDF', 'Pluie tropicale', 'Moustique', 'Wifi capricieux', 'Manioc', 'Fusée Ariane', 'Pirogue', 'Bug 404', 'Sieste', 'Carnaval'];
const attaques = ['Délestage surprise', 'Averse de 15 h', 'Piqûre nocturne', 'Ping à 900 ms', 'Couac explosif', 'Décollage de Kourou', 'Coup de pagaie', 'Écran bleu', 'Hamac éternel', 'Touloulou mystère'];

function genererCreature() {
  const h = alea(0, 359);
  const shiny = Math.random() < 0.1;
  const corps = shiny ? 'hsl(48 95% 60%)' : `hsl(${h} 70% 60%)`;
  const fonce = shiny ? 'hsl(40 90% 40%)' : `hsl(${h} 55% 38%)`;
  const ventre = shiny ? 'hsl(55 100% 85%)' : `hsl(${(h + 40) % 360} 80% 82%)`;
  const forme = alea(0, 2);
  const [rx, ry, cy] = [[38, 34, 72], [28, 40, 70], [44, 28, 78]][forme];
  const haut = cy - ry;
  let s = '<g class="corps">';

  // queue
  if (Math.random() < 0.6) {
    s += choix([
      `<path d="M${60 + rx - 6} ${cy + 10} q22 -6 18 -30 q-2 -10 8 -12" stroke="${fonce}" stroke-width="7" fill="none" stroke-linecap="round"/>`,
      `<path d="M${60 + rx - 6} ${cy + 8} l14 -6 -6 -8 14 -6 -6 -8 12 -4" stroke="${fonce}" stroke-width="6" fill="none" stroke-linejoin="round"/>`
    ]);
  }
  // oreilles / cornes / antennes
  const tete = alea(0, 4);
  if (tete === 1) s += `<path d="M${60 - rx * .7} ${haut + 12} l6 -28 14 22Z M${60 + rx * .7} ${haut + 12} l-6 -28 -14 22Z" fill="${fonce}"/>`;
  if (tete === 2) s += `<circle cx="${60 - rx * .65}" cy="${haut + 6}" r="11" fill="${fonce}"/><circle cx="${60 + rx * .65}" cy="${haut + 6}" r="11" fill="${fonce}"/>`;
  if (tete === 3) s += `<path d="M52 ${haut + 4} q-8 -18 -16 -22 M68 ${haut + 4} q8 -18 16 -22" stroke="${fonce}" stroke-width="3" fill="none"/><circle cx="36" cy="${haut - 18}" r="5" fill="#ffe14d"/><circle cx="84" cy="${haut - 18}" r="5" fill="#ffe14d"/>`;
  if (tete === 4) s += `<path d="M48 ${haut + 6} l-4 -20 10 16Z M72 ${haut + 6} l4 -20 -10 16Z" fill="#f4ecd8" stroke="#a89a7a"/>`;
  // pieds
  s += `<ellipse cx="${60 - rx * .5}" cy="${cy + ry - 2}" rx="11" ry="6" fill="${fonce}"/><ellipse cx="${60 + rx * .5}" cy="${cy + ry - 2}" rx="11" ry="6" fill="${fonce}"/>`;
  // corps + ventre
  s += `<ellipse cx="60" cy="${cy}" rx="${rx}" ry="${ry}" fill="${corps}" stroke="${fonce}" stroke-width="2.5"/>`;
  s += `<ellipse cx="60" cy="${cy + ry * .35}" rx="${rx * .6}" ry="${ry * .5}" fill="${ventre}"/>`;
  // motif
  if (Math.random() < 0.5) s += `<circle cx="${60 - rx * .55}" cy="${cy - 4}" r="5" fill="${fonce}" opacity=".5"/><circle cx="${60 + rx * .6}" cy="${cy + 6}" r="4" fill="${fonce}" opacity=".5"/>`;
  // joues
  s += `<circle cx="${60 - rx * .55}" cy="${cy + 2}" r="5" fill="#ff7a9a" opacity=".55"/><circle cx="${60 + rx * .55}" cy="${cy + 2}" r="5" fill="#ff7a9a" opacity=".55"/>`;
  // bouche
  s += choix([
    `<path d="M52 ${cy + 4} q8 8 16 0" stroke="#222" stroke-width="2.5" fill="none" stroke-linecap="round"/>`,
    `<ellipse cx="60" cy="${cy + 6}" rx="6" ry="5" fill="#5a1a2a"/>`,
    `<path d="M52 ${cy + 4} q8 6 16 0" stroke="#222" stroke-width="2.5" fill="none"/><path d="M56 ${cy + 6} l2 5 2 -4Z" fill="#fff"/>`,
    `<path d="M53 ${cy + 6} h14" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>`
  ]);
  s += '</g><g class="yeux">';
  // yeux (restent visibles dans le noir)
  const nb = choix([1, 2, 2, 2, 3]);
  const ey = cy - ry * .35;
  const xs = nb === 1 ? [60] : nb === 2 ? [48, 72] : [44, 60, 76];
  const r = nb === 1 ? 11 : 7;
  for (const x of xs) {
    s += `<circle class="blanc" cx="${x}" cy="${ey}" r="${r}"/><circle class="pupille" cx="${x + alea(-1, 2)}" cy="${ey + 1}" r="${r * .5}"/>`;
  }
  s += '</g>';
  if (shiny) s += '<text x="94" y="30" font-size="16">✨</text><text x="14" y="104" font-size="12">✨</text>';

  const nom = choix(debuts) + choix(fins);
  return {
    svg: `<svg viewBox="0 0 120 120">${s}<\/svg>`,
    texte: `<span class="num">N°${String(alea(1, 999)).padStart(3, '0')}</span> <b>${nom}</b>${shiny ? ' <span class="shiny">SHINY</span>' : ''}<br>type ${choix(types)} · attaque : ${choix(attaques)}`
  };
}

function clic() {
  try {
    audio ??= new AudioContext();
    const o = audio.createOscillator();
    const g = audio.createGain();
    o.type = 'square';
    o.frequency.value = 180;
    g.gain.setValueAtTime(0.08, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.06);
    o.connect(g).connect(audio.destination);
    o.start();
    o.stop(audio.currentTime + 0.07);
  } catch (e) {}
}

function eteindre() {
  clearTimeout(minuteur);
  piece.classList.add('clignote');
  setTimeout(() => {
    piece.classList.remove('clignote', 'allumee');
    indice.textContent = Math.random() < .5 ? 'encore une coupure… ← tire la corde' : '← tire la corde';
  }, 700);
}

function creatureRare() {
  const r = choix(raresDispo);
  return {
    svg: `<img class="corps rare" src="${r.fichier}" alt="${r.nom}">`,
    texte: `<span class="shiny">✨ RARE</span> <b>${r.nom}</b><br>type ${choix(types)} · attaque : ${choix(attaques)}`
  };
}

function allumer() {
  const c = raresDispo.length && Math.random() < RARE_CHANCE ? creatureRare() : genererCreature();
  zone.innerHTML = c.svg;
  carte.innerHTML = c.texte;
  zone.classList.remove('apparait');
  void zone.offsetWidth;
  zone.classList.add('apparait');
  piece.classList.add('allumee');
  total.textContent = ++decouvertes;
  indice.textContent = '';
  clearTimeout(minuteur);
  minuteur = setTimeout(eteindre, alea(4000, 8000));
}

function ajuster() {
  document.documentElement.style.setProperty('--k', Math.min(innerHeight / 400, 1.2));
}
addEventListener('resize', ajuster);
ajuster();

function tirer() {
  if (!corde.classList.contains('en-main')) {
    corde.classList.remove('tiree');
    void corde.offsetWidth;
    corde.classList.add('tiree');
  }
  clic();
  if (piece.classList.contains('allumee')) eteindre();
  else setTimeout(allumer, 180);
}

// Glisser la corde vers le bas (souris ou doigt)
let depart = null;
let declenche = false;
function bouger(e) {
  if (depart === null) return;
  e.preventDefault();
  const k = parseFloat(getComputedStyle(piece).getPropertyValue('--k')) || 1;
  const d = Math.max(0, Math.min(70, (e.clientY - depart) / k));
  corde.style.setProperty('--tire', d + 'px');
  if (d > 30 && !declenche) {
    declenche = true;
    tirer();
  }
}
function lacher() {
  if (depart === null) return;
  if (!declenche) tirer();
  depart = null;
  corde.classList.remove('en-main');
  corde.style.setProperty('--tire', '0px');
}
corde.addEventListener('pointerdown', e => {
  e.preventDefault();
  depart = e.clientY;
  declenche = false;
  corde.classList.add('en-main');
  corde.classList.remove('tiree');
});
addEventListener('pointermove', bouger, { passive: false });
addEventListener('pointerup', lacher);
addEventListener('pointercancel', lacher);
addEventListener('blur', lacher);
corde.addEventListener('dragstart', e => e.preventDefault());

// Clavier (Entrée / Espace)
corde.addEventListener('click', e => { if (e.detail === 0) tirer(); });
</script>

<script>
// ===== Chambre 2 : le bouton qui fuit =====
(() => {
  const salle = document.getElementById('fuite');
  const bouton = document.getElementById('fuyard');
  const bulle = document.getElementById('bulle');
  const boum = document.getElementById('boum');
  const essais = document.getElementById('essais');
  const explosions = document.getElementById('explosions');

  const repliques = [
    ['Non.', 'Même pas en rêve.', 'Raté !'],
    ['Arrête !', 'Laisse-moi tranquille !', 'Trop lent !'],
    ['S\'il te plaît…', 'J\'ai une famille !', 'Pourquoi tu fais ça ?'],
    ['Je suis fatigué…', 'Pitié, une pause…', 'J\'ai plus de jambes…'],
  ];
  let fuites = 0;
  let enPause = false;
  let minuteBulle = null;
  let dernierSaut = 0;

  const k = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--k')) || 1;
  const fatigue = () => Math.min(3, Math.floor(fuites / 10));   // 0 à 3

  function placer(x, y) {
    const r = salle.getBoundingClientRect();
    const b = bouton.getBoundingClientRect();
    const marge = 10;
    x = Math.max(marge, Math.min(r.width - b.width - marge, x));
    y = Math.max(30 * k(), Math.min(r.height - b.height - 40 * k(), y));
    bouton.style.left = x + 'px';
    bouton.style.top = y + 'px';
    if (!bulle.hidden) poserBulle();
  }

  function centrer() {
    const r = salle.getBoundingClientRect();
    const b = bouton.getBoundingClientRect();
    placer((r.width - b.width) / 2, (r.height - b.height) / 2);
  }

  // la bulle suit le bouton (position d'arrivée, pas pendant l'animation)
  function poserBulle() {
    const r = salle.getBoundingClientRect();
    const x = parseFloat(bouton.style.left) || 0;
    const y = parseFloat(bouton.style.top) || 0;
    bulle.style.left = Math.max(6, Math.min(r.width - bulle.offsetWidth - 6, x)) + 'px';
    bulle.style.top = (y > 70 ? y - 34 : y + bouton.offsetHeight + 8) + 'px';
  }

  function parler(texte) {
    bulle.textContent = texte;
    bulle.hidden = false;
    poserBulle();
    clearTimeout(minuteBulle);
    minuteBulle = setTimeout(() => { bulle.hidden = true; }, 1200);
  }

  function fuir(px, py) {
    const r = salle.getBoundingClientRect();
    const b = bouton.getBoundingClientRect();
    const cx = b.left + b.width / 2 - r.left;
    const cy = b.top + b.height / 2 - r.top;
    let dx = cx - px, dy = cy - py;
    const d = Math.hypot(dx, dy) || 1;
    const saut = (140 - fatigue() * 35) * k();
    let nx = cx + dx / d * saut + (Math.random() - .5) * 60 - b.width / 2;
    let ny = cy + dy / d * saut + (Math.random() - .5) * 60 - b.height / 2;
    // coincé dans un coin ? téléportation de l'autre côté
    if (nx < 10 || ny < 30 || nx > r.width - b.width - 10 || ny > r.height - b.height - 40) {
      if (Math.random() < .5) { nx = r.width - nx - b.width; ny = r.height - ny - b.height; }
    }
    placer(nx, ny);
    fuites++;
    essais.textContent = fuites;
    salle.dataset.fatigue = fatigue();
    if (Math.random() < .45) parler(choixReplique());
  }

  function choixReplique() {
    const l = repliques[fatigue()];
    return l[Math.floor(Math.random() * l.length)];
  }

  salle.addEventListener('pointermove', e => {
    if (enPause) return;
    const r = salle.getBoundingClientRect();
    const b = bouton.getBoundingClientRect();
    const px = e.clientX - r.left, py = e.clientY - r.top;
    const cx = b.left + b.width / 2 - r.left, cy = b.top + b.height / 2 - r.top;
    const seuil = (95 - fatigue() * 22) * k();     // plus il est fatigué, moins il voit venir
    // petit délai entre deux sauts : le temps qu'il finisse de bouger
    if (Math.hypot(px - cx, py - cy) < seuil && performance.now() - dernierSaut > 160 + fatigue() * 120) {
      dernierSaut = performance.now();
      fuir(px, py);
    }
  });

  bouton.addEventListener('click', () => {
    if (enPause) return;
    enPause = true;
    bulle.hidden = true;
    explosions.textContent = +explosions.textContent + 1;
    // éclats
    const r = salle.getBoundingClientRect();
    const b = bouton.getBoundingClientRect();
    for (let i = 0; i < 28; i++) {
      const e = document.createElement('span');
      e.className = 'eclat';
      e.style.left = (b.left - r.left + b.width / 2) + 'px';
      e.style.top = (b.top - r.top + b.height / 2) + 'px';
      const a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 140;
      e.style.setProperty('--dx', Math.cos(a) * v + 'px');
      e.style.setProperty('--dy', Math.sin(a) * v + 'px');
      e.style.background = ['#ff5f3c', '#ffd84d', '#ff9f1c', '#fff'][i % 4];
      salle.append(e);
      setTimeout(() => e.remove(), 900);
    }
    bouton.classList.add('casse');
    salle.classList.add('flash');
    boum.hidden = false;
    setTimeout(() => {
      salle.classList.remove('flash');
      boum.hidden = true;
      parler(fuites < 3 ? 'Hé ! J\'avais même pas commencé !' : 'Tu as cassé le bouton. Bravo.');
    }, 900);
    setTimeout(() => {
      bouton.classList.remove('casse');
      fuites = 0;
      essais.textContent = 0;
      salle.dataset.fatigue = 0;
      centrer();
      enPause = false;
    }, 3000);
  });

  addEventListener('resize', centrer);
  requestAnimationFrame(centrer);
})();
</script>

<script>
// ===== Chambre 3 : la radio =====
(() => {
  const salle = document.getElementById('radio-salle');
  const curseur = document.getElementById('freq');
  const aiguille = document.getElementById('aiguille');
  const ecran = document.getElementById('ecran-freq');
  const ondes = document.getElementById('ondes');
  const power = document.getElementById('power');
  const voyant = document.getElementById('voyant');
  const rond = document.getElementById('bouton-rond');

  const stations = [
    { f: 89.6, nom: 'Radio Météo', lignes: [
      'Prévisions : soleil le matin, grosse averse à 15 h. Comme d\'habitude.',
      'Taux d\'humidité aujourd\'hui : oui.',
      'Alerte : un nuage a été aperçu au-dessus de Cayenne. Restez calmes.',
      'Température ressentie : four à pizza.' ] },
    { f: 93.4, nom: 'Flash Info', lignes: [
      'Un moustique arrêté pour excès de vitesse sur la RN1.',
      'Coupure de courant annoncée ce soir… ah non, elle est déjà là.',
      'Le bouton de la chambre 2 porte plainte pour harcèlement.',
      'Une lampe de la chambre 1 affirme voir des créatures. Enquête en cours.' ] },
    { f: 97.8, nom: 'Radio Pub', lignes: [
      'Nouveau ! Le hamac 2.0, avec Wi-Fi intégré. Le réseau, toujours pas.',
      'Groupe électrogène Turbo : il démarre du premier coup. Presque jamais.',
      'Anti-moustique Ultra : efficace contre tout, sauf les moustiques.' ] },
    { f: 101.1, nom: 'Radio Kourou', lignes: [
      'Lancement dans dix secondes… neuf… huit… on vous rappelle plus tard.',
      'La fusée est partie. Ou alors c\'est le voisin qui tond sa pelouse.',
      'Objectif de la mission : livrer une pizza en orbite.' ] },
    { f: 105.3, nom: 'Hit Machine 8-bit', musique: true, lignes: [
      '♪ Le tube du moment, composé par un ordinateur fatigué ♪' ] },
  ];

  let allumee = false;
  let ctx = null, bruit = null, gainBruit = null, gainMusique = null;
  let stationActive = null, indexLigne = 0, minuteurLigne = null, minuteurMusique = null;
  const voix = 'speechSynthesis' in window ? speechSynthesis : null;

  function demarrerAudio() {
    if (ctx) return;
    try {
      ctx = new AudioContext();
      // bruit blanc pour le grésillement entre les stations
      const buf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      bruit = ctx.createBufferSource();
      bruit.buffer = buf;
      bruit.loop = true;
      const filtre = ctx.createBiquadFilter();
      filtre.type = 'bandpass';
      filtre.frequency.value = 1800;
      gainBruit = ctx.createGain();
      gainBruit.gain.value = 0;
      bruit.connect(filtre).connect(gainBruit).connect(ctx.destination);
      bruit.start();
      gainMusique = ctx.createGain();
      gainMusique.gain.value = 0.05;
      gainMusique.connect(ctx.destination);
    } catch (e) { ctx = null; }
  }

  // petite mélodie générée au hasard (gamme pentatonique)
  const gamme = [262, 294, 330, 392, 440, 523, 587, 659];
  function jouerNote() {
    if (!ctx) return;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = Math.random() < .7 ? 'square' : 'triangle';
    o.frequency.value = gamme[Math.floor(Math.random() * gamme.length)] * (Math.random() < .2 ? .5 : 1);
    g.gain.setValueAtTime(1, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + .18);
    o.connect(g).connect(gainMusique);
    o.start();
    o.stop(ctx.currentTime + .2);
  }

  function arreterEmission() {
    clearTimeout(minuteurLigne);
    clearInterval(minuteurMusique);
    minuteurMusique = null;
    if (voix) voix.cancel();
    stationActive = null;
  }

  function direLigne() {
    if (!stationActive) return;
    const s = stationActive;
    const texte = s.lignes[indexLigne % s.lignes.length];
    indexLigne++;
    ondes.innerHTML = `<b>${s.nom}</b><br>${texte}`;
    let fini = false;
    const suite = () => { if (!fini && stationActive === s) { fini = true; minuteurLigne = setTimeout(direLigne, 900); } };
    if (voix && !s.musique) {
      const u = new SpeechSynthesisUtterance(texte);
      u.lang = 'fr-FR';
      u.rate = 1.05;
      u.pitch = 0.8 + stations.indexOf(s) * 0.15;
      u.onend = suite;
      voix.speak(u);
      setTimeout(suite, 9000);          // au cas où la voix ne marche pas
    } else {
      setTimeout(suite, 4500);
    }
  }

  function regler() {
    const f = parseFloat(curseur.value);
    const pct = (f - 88) / 20;
    aiguille.style.left = (8 + pct * 84) + '%';
    rond.style.transform = `rotate(${pct * 300 - 150}deg)`;
    if (!allumee) return;
    ecran.textContent = f.toFixed(1) + ' MHz';

    // station la plus proche et force du signal
    let proche = stations[0], dist = 99;
    for (const s of stations) {
      const d = Math.abs(s.f - f);
      if (d < dist) { dist = d; proche = s; }
    }
    const signal = Math.max(0, 1 - dist / 0.8);
    if (gainBruit) gainBruit.gain.value = (1 - signal) * 0.12;
    if (gainMusique) gainMusique.gain.value = proche.musique ? signal * 0.06 : 0;
    voyant.style.opacity = 0.2 + signal * 0.8;
    salle.style.setProperty('--signal', signal);

    if (signal > 0.6) {
      if (stationActive !== proche) {
        arreterEmission();
        stationActive = proche;
        indexLigne = Math.floor(Math.random() * proche.lignes.length);
        if (proche.musique) minuteurMusique = setInterval(jouerNote, 200);
        direLigne();
      }
    } else {
      if (stationActive) arreterEmission();
      ondes.innerHTML = '<span class="gresille">~ kssshhhh ~</span>';
    }
  }

  power.addEventListener('click', () => {
    allumee = !allumee;
    salle.classList.toggle('radio-on', allumee);
    if (allumee) {
      demarrerAudio();
      if (ctx && ctx.state === 'suspended') ctx.resume();
      regler();
    } else {
      arreterEmission();
      if (gainBruit) gainBruit.gain.value = 0;
      if (gainMusique) gainMusique.gain.value = 0;
      ecran.textContent = '--.- MHz';
      voyant.style.opacity = 0.1;
      ondes.textContent = 'Allume la radio ⏻ puis tourne le cadran.';
    }
  });

  curseur.addEventListener('input', regler);
  // molette de la souris sur la radio = tourner le bouton
  document.getElementById('radio').addEventListener('wheel', e => {
    e.preventDefault();
    curseur.value = Math.max(88, Math.min(108, parseFloat(curseur.value) + (e.deltaY > 0 ? -0.2 : 0.2)));
    regler();
  }, { passive: false });

  regler();
})();
</script>
