
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COLOR REVERSE</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <header>
        <h1>COLOR REVERSE</h1>
        <p>Devine les couleurs originales des images !</p>
    </header>

    <main>
        <section id="jeu">
            <h2>À toi de jouer !</h2>
            <p id="score">Score : 0</p>

            <img id="image-jeu" src="images/Pomme verte.png" alt="Image à deviner">

<div id="couleurs">
    <h3>Quelles étaient les couleurs originales ?</h3>

    <label class="rouge">
        <input type="checkbox" value="rouge">
        Rouge
    </label>

    <label class="bleu">
        <input type="checkbox" value="bleu">
        Bleu
    </label>

    <label class="vert">
        <input type="checkbox" value="vert">
        Vert
    </label>

    <label class="jaune-orange">
        <input type="checkbox" value="jaune-orange">
        Jaune / Orange
    </label>

    <label class="rose">
        <input type="checkbox" value="rose">
        Rose
    </label>

    <label class="violet">
        <input type="checkbox" value="violet">
        Violet
    </label>

    <label class="noir">
        <input type="checkbox" value="noir">
        Noir
    </label>

    <label class="blanc">
        <input type="checkbox" value="blanc">
        Blanc
    </label>

    <label class="marron">
        <input type="checkbox" value="marron">
        Marron
    </label>

    <label class="gris">
        <input type="checkbox" value="gris">
        Gris
    </label>
</div>
<button id="valider">Valider ma réponse</button>
<button id="recommencer" hidden>Recommencer</button>
<p id="resultat"></p>

        </section>
    </main>

</body>
</html>
